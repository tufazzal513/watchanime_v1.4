<header id="global-header" class="fixed top-0 left-0 right-0 h-14 z-50 flex justify-between items-center px-4">

        <img id="header-logo-img" src="" alt="" class="hidden" style="display:none">
        <h1 class="nf-wordmark dynamic-app-name mb-0"></h1>
    </div>
    <div class="flex items-center gap-4">
        <span id="header-user-name" class="text-xs text-gray-300 hidden md:inline"></span>
        <button onclick="showPage('search-page')" class="nf-hbtn" aria-label="Search"><i class="fas fa-search"></i></button>
        <button onclick="showPage('notifications-page')" class="nf-hbtn" aria-label="Notifications"><i class="fas fa-bell"></i></button>
        <button onclick="showPage('profile-page')" class="nf-avatar" aria-label="Profile"><i class="fas fa-user"></i></button>
